[package]
edition      = "2024"
name         = "fluidbox"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "fluidbox"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "~1.1.0", features = ["esp32s3", "log-04", "unstable"] }

esp-rtos = { version = "0.3.0", features = [
  "embassy",
  "esp-alloc",
  "esp32s3",
  "log-04",
] }

esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3", "log-04"] }
log                    = "0.4.27"

embassy-executor = { version = "0.10.0", features = ["log"] }
embassy-time     = { version = "0.5.0", features = ["log"] }
esp-alloc        = "0.10.0"
esp-println      = { version = "0.17.0", default-features = false, features = ["esp32s3", "log-04", "jtag-serial", "colors", "critical-section"] }

critical-section = "1.2.0"
esp-sync         = "0.2"
static_cell      = "2.1.1"
libm             = "0.2"

[build-dependencies]
cc = "1"

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units    = 1
debug            = 0
lto              = 'fat'
opt-level        = 3
overflow-checks  = false
panic            = "abort"
